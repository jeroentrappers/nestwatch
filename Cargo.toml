[workspace]
resolver = "3"
members = ["crates/*", "tools/nestwatch-cli", "apps/ui", "apps/web", "apps/desktop"]
# The desktop app needs the WebKitGTK development libraries on Linux; keep it
# out of plain `cargo build`/`cargo test` at the root.
default-members = ["crates/*", "tools/nestwatch-cli", "apps/ui", "apps/web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jeroentrappers/nestwatch"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Argon2id (code pairing PSK, protocol.md §5.3) is far too slow unoptimised;
# keep tests and debug builds usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
