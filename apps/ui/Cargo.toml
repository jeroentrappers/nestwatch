[package]
name = "lull-ui"
description = "Shared Dioxus components and screens of the Lull desktop and browser apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
## Backend adapters over the native lull-core engines (station and listener).
native = ["dep:lull-core", "lull-core/native", "dep:lull-media", "dep:tokio"]
## Backend adapter over the browser lull-core listener engine (wasm32).
web = ["dep:lull-core", "lull-core/web", "dep:tokio"]

[dependencies]
base64 = "0.22.1"
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
lull-core = { path = "../../crates/lull-core", default-features = false, optional = true }
lull-media = { path = "../../crates/lull-media", optional = true }
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync"], optional = true }

[dev-dependencies]
dioxus-ssr = "0.7.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
