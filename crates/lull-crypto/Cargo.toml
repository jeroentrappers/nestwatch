[package]
name = "lull-crypto"
description = "Device identity, key derivation and Noise handshakes for the Lull Wire Protocol (LWP/1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["zeroize"] }
getrandom = "0.3.4"
hkdf = "0.12.4"
sha2 = { version = "0.10.9", default-features = false }
snow = { version = "0.10.0", default-features = false, features = [
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
    "use-getrandom",
] }
thiserror = "2"
zeroize = "1.8"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
