[package]
name = "lull-core"
description = "Lull station and listener engines: trust stores, pairing mode, sessions, reconnect, alerts, settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["native"]
## Station and listener engines on tokio (TCP, WebSocket, HTTP(S), mDNS).
native = ["tokio/rt", "tokio/time"]
## Listener engine in the browser (wasm32): WebSocket only, browser timers.
web = ["dep:wasm-bindgen-futures", "dep:gloo-timers", "dep:js-sys"]
## Opus (audio codec 1) through lull-media's libopus binding. Native only.
opus = ["lull-media/opus"]

[dependencies]
lull-crypto = { path = "../lull-crypto" }
lull-media = { path = "../lull-media" }
lull-net = { path = "../lull-net" }
lull-proto = { path = "../lull-proto" }
lull-session = { path = "../lull-session" }
minicbor = { version = "2.3.1", features = ["alloc", "derive"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }

gloo-timers = { version = "0.3", features = ["futures"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
