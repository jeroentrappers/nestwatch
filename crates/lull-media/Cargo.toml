[package]
name = "lull-media"
description = "Lull audio and video processing: capture chain, codecs, sound activation, jitter buffer, mixer, JPEG helpers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
## Opus (codec 1) via libopus. Native targets only.
opus = ["dep:opus"]

[dependencies]
jpeg-encoder = "0.7"
zune-jpeg = "0.5"
opus = { version = "0.3", optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
