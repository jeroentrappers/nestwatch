# UniFFI bindings configuration (library mode reads it via cargo metadata).
[bindings.kotlin]
package_name = "org.nestwatch.ffi"
# Android cleaner on API 34+, JNA cleaner below; androidx annotations.
android = true
# Records as `val` data classes (stable for Compose).
generate_immutable_records = true

[bindings.swift]
module_name = "NestwatchFFI"
ffi_module_name = "NestwatchFFIFFI"
