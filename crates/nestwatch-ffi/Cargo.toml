[package]
name = "nestwatch-ffi"
description = "UniFFI bindings exposing the Nestwatch engines to Kotlin and Swift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "nestwatch_ffi"

[[bin]]
# `cargo run -p nestwatch-ffi --bin uniffi-bindgen -- generate --library ...`
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
## The bindings generator binary (host only).
bindgen = ["uniffi/cli"]

[dependencies]
nestwatch-core = { path = "../nestwatch-core" }
nestwatch-media = { path = "../nestwatch-media" }
nestwatch-crypto = { path = "../nestwatch-crypto" }
nestwatch-net = { path = "../nestwatch-net" }
nestwatch-proto = { path = "../nestwatch-proto" }
qrcode = { version = "0.14", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = "0.32"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# The workspace forbids `unsafe_code`. The UniFFI scaffolding generated by
# the macros needs it (extern "C" entry points) and allows it locally, which
# `forbid` would reject, so this crate lists its lints itself and denies
# `unsafe` in hand-written code instead.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
