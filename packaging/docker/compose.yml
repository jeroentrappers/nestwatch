# SPDX-License-Identifier: AGPL-3.0-or-later
# Nestwatch relay with the browser listener and website, plus Caddy for
# automatic HTTPS. Needs a domain pointing at this host and open ports
# TCP 80 + 443 and UDP 3478 (STUN, for direct connections).
#
#   cp .env.example .env    # set NESTWATCH_DOMAIN
#   docker compose up -d
#
# Already running nginx, Traefik or another proxy? Use compose.proxy.yml.
name: nestwatch

services:
  nestwatch:
    image: ghcr.io/jeroentrappers/nestwatch-server:${NESTWATCH_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Believe Caddy's X-Forwarded-For (per-IP limits need the real client).
      NESTWATCH_SERVER_TRUSTED_PROXIES: ${NESTWATCH_SUBNET:-172.31.240.0/24}
    ports:
      - "3478:3478/udp"
    volumes:
      - nestwatch-data:/data
    networks: [nestwatch]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [nestwatch]
    environment:
      NESTWATCH_DOMAIN: ${NESTWATCH_DOMAIN:?set NESTWATCH_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [nestwatch]

networks:
  nestwatch:
    ipam:
      config:
        - subnet: ${NESTWATCH_SUBNET:-172.31.240.0/24}

volumes:
  nestwatch-data:
  caddy-data:
  caddy-config:
